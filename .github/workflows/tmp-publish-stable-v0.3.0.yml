name: Publish LoM-VI v0.3.0 stable

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-publish-stable-v0.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate stable channel
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == "lomvi.thin.v3" and .channel == "stable"' channel/manifest.json >/dev/null
          jq -e '.patcher.minimum_version == "0.3.0"' channel/manifest.json >/dev/null
          jq -e '.translation.version == "2026.09.03.4"' channel/manifest.json >/dev/null
          jq -e '.font.version == "2026.09.05.1" and .font.game_build == "2018737"' channel/manifest.json >/dev/null

      - name: Fetch exact accepted stable artifacts
        shell: bash
        env:
          API_ROOT: https://api.firestorage.ai/dev/file
          SHARE_ID: 3ku3uUdQRdWv
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fLsS --retry 3 "$API_ROOT/shares/$SHARE_ID/files?maxResults=1000" -o files.json
          jq -e '.files | length >= 2' files.json >/dev/null

          fetch_one() {
            local name="$1"
            local out="dist/$name"
            local id
            id=$(jq -r --arg n "$name" '.files[] | select(.fileName == $n) | .fileId' files.json | head -n1)
            test -n "$id" && test "$id" != "null"
            curl -fLsS --retry 3 -X POST "$API_ROOT/shares/$SHARE_ID/files/$id/download" -o download.json
            url=$(jq -r '.downloadUrl' download.json)
            test -n "$url" && test "$url" != "null"
            curl -fL --retry 3 "$url" -o "$out"
          }

          fetch_one 'LoM-VI-v0.3.0.exe'
          fetch_one 'LoM-VI-v0.3.0-Source.zip'

          test "$(stat -c%s dist/LoM-VI-v0.3.0.exe)" = '6040064'
          test "$(sha256sum dist/LoM-VI-v0.3.0.exe | awk '{print $1}')" = 'e9a75380ad2bb6d9a0d45d6632bd087df457c50eceb863d919d86a14ba084f31'
          test "$(stat -c%s dist/LoM-VI-v0.3.0-Source.zip)" = '507527'
          test "$(sha256sum dist/LoM-VI-v0.3.0-Source.zip | awk '{print $1}')" = '4df9541d1e9dd6c6f96e82ec90b4ed90d3a31d229b45ebcb5cafbcca57fa839d'
          (cd dist && sha256sum LoM-VI-v0.3.0.exe LoM-VI-v0.3.0-Source.zip > SHA256SUMS.txt)

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists; refusing duplicate publish.' >&2
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          # LoM-VI v0.3.0 — Stable

          Bản Stable đầu tiên của patcher LoM-VI theo kiến trúc thin updater.

          ## Thành phần Stable
          - Bản dịch tiếng Việt: `2026.09.03.4`
          - Font Việt Hoá: `2026.09.05.1`
          - Game build đã kiểm thử: `2018737`
          - Body/UI: IBM Plex Sans Condensed Medium
          - Title: Spectral SemiBold

          ## Runtime / fallback
          - Chỉ LoM-VI: **Việt → Trung gốc**.
          - LoM-VI + English Patch: **Việt → Anh → Trung gốc**.
          - Native bootstrap route đã được tích hợp vào patcher; không cần chạy helper thủ công.

          ## Updater
          `LoM-VI-v0.3.0.exe` đọc `channel/manifest.json` trên GitHub mỗi lần mở với no-cache. Các bản cập nhật Translation / Font / Core tương thích có thể được phát hành trên cloud mà không cần phát hành EXE mới.

          ## Trạng thái UI
          Khi thành phần hiện tại đã đúng và đầy đủ, patcher hiển thị **Đã Cài Đặt** màu xanh lá và không hiện nút **Sửa Chữa**.

          ## SHA-256
          Xem `SHA256SUMS.txt` đính kèm.
          EOF
          gh release create v0.3.0 \
            dist/LoM-VI-v0.3.0.exe \
            dist/LoM-VI-v0.3.0-Source.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'LoM-VI v0.3.0 — Stable' \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.3.0 --json tagName,name,isDraft,isPrerelease,url,assets > release.json
          jq -e '.tagName == "v0.3.0" and .isDraft == false and .isPrerelease == false' release.json >/dev/null
          jq -e '[.assets[].name] | index("LoM-VI-v0.3.0.exe") != null and index("LoM-VI-v0.3.0-Source.zip") != null and index("SHA256SUMS.txt") != null' release.json >/dev/null
          cat release.json
