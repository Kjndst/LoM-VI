name: Audit current Core payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-core-payload.yml'
      - 'channel/core-0.2.0.4.zip'

permissions:
  contents: read

jobs:
  audit-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current channel Core
        shell: bash
        run: |
          set -euo pipefail
          CORE='channel/core-0.2.0.4.zip'
          echo "CORE_SIZE=$(stat -c '%s' "$CORE")"
          echo "CORE_SHA256=$(sha256sum "$CORE" | awk '{print $1}')"
          unzip -t "$CORE"
          WORK="$(mktemp -d)"
          unzip -q "$CORE" -d "$WORK"
          sha256sum \
            "$WORK/game/Saved/Mods/bootstrap.lua" \
            "$WORK/game/Saved/Mods/lua/mods/lom_vi/BootstrapFactory.lua" \
            "$WORK/game/Saved/Mods/lua/mods/lom_vi/Init.lua"
          echo 'b49c783eee9a3eda70ac08c80a606a680bb4d14d8ae1d80c0f9cb9730548090c  EXPECT-bootstrap.lua'
          echo '0e892ff640c262d9b8712737c3d3be02e75f73b3bd71896482e839c67a3a0d28  EXPECT-BootstrapFactory.lua'
          echo 'f282e502733c254906476e58cdcf24200e8c5e5820b829a1d3cd199d2a2be806  EXPECT-Init.lua'
          test "$(sha256sum "$WORK/game/Saved/Mods/bootstrap.lua" | awk '{print $1}')" = 'b49c783eee9a3eda70ac08c80a606a680bb4d14d8ae1d80c0f9cb9730548090c'
          test "$(sha256sum "$WORK/game/Saved/Mods/lua/mods/lom_vi/BootstrapFactory.lua" | awk '{print $1}')" = '0e892ff640c262d9b8712737c3d3be02e75f73b3bd71896482e839c67a3a0d28'
          test "$(sha256sum "$WORK/game/Saved/Mods/lua/mods/lom_vi/Init.lua" | awk '{print $1}')" = 'f282e502733c254906476e58cdcf24200e8c5e5820b829a1d3cd199d2a2be806'
          echo 'CORE_LOGICAL_CONTENT=PASS'
