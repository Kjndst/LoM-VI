name: Build LoM-VI Kraken font payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-kraken-build-temp.yml'

permissions:
  contents: read

jobs:
  build-font-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned fonts and build raw UFont wrappers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lomvi-font/raw
          GF=f265cc2d8e08067dac782ba633458b97661ab85d
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/${GF}/ofl/ibmplexsanscondensed/IBMPlexSansCondensed-Medium.ttf" \
            -o /tmp/lomvi-font/IBMPlexSansCondensed-Medium.ttf
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/${GF}/ofl/spectral/Spectral-SemiBold.ttf" \
            -o /tmp/lomvi-font/Spectral-SemiBold.ttf
          test "$(stat -c '%s' /tmp/lomvi-font/IBMPlexSansCondensed-Medium.ttf)" = 111176
          test "$(stat -c '%s' /tmp/lomvi-font/Spectral-SemiBold.ttf)" = 273068
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root=Path('/tmp/lomvi-font')
          for src,name in [
              ('IBMPlexSansCondensed-Medium.ttf','IBM-Plex-Sans-Condensed-Medium.ufont'),
              ('Spectral-SemiBold.ttf','Spectral-SemiBold.ufont'),
          ]:
              b=(root/src).read_bytes()
              out=root/'raw'/name
              out.write_bytes(struct.pack('<I',len(b))+b+b'\0\0\0\0')
              print(name, out.stat().st_size)
          PY
          test "$(stat -c '%s' /tmp/lomvi-font/raw/IBM-Plex-Sans-Condensed-Medium.ufont)" = 111184
          test "$(stat -c '%s' /tmp/lomvi-font/raw/Spectral-SemiBold.ufont)" = 273076

      - name: Build pinned GPL Kraken encoder for build-time only
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/oMaN-Rod/ooz-rs.git /tmp/ooz-rs
          git -C /tmp/ooz-rs checkout c197be7a4b49b2f37f339888da1c10ab87780c19
          git -C /tmp/ooz-rs submodule update --init --recursive
          test "$(git -C /tmp/ooz-rs rev-parse HEAD)" = c197be7a4b49b2f37f339888da1c10ab87780c19
          test "$(git -C /tmp/ooz-rs/ooz rev-parse HEAD)" = b938f47dd2e7ade6a503993ab30e0cde734bbd47
          mkdir -p /tmp/kraken-tool/src /tmp/lomvi-font/kraken
          cat >/tmp/kraken-tool/Cargo.toml <<'TOML'
          [package]
          name = "lomvi-kraken-build"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          ooz-rs = { path = "/tmp/ooz-rs" }
          TOML
          cat >/tmp/kraken-tool/src/main.rs <<'RS'
          use ooz_rs::{compress, decompress, OodleCompressor, OodleLevel};
          use std::{env, fs, path::Path};

          const BLOCK: usize = 65536;

          fn main() {
              let args: Vec<String> = env::args().collect();
              assert_eq!(args.len(), 3, "usage: tool RAW_DIR OUT_DIR");
              let raw_dir = Path::new(&args[1]);
              let out_dir = Path::new(&args[2]);
              fs::create_dir_all(out_dir).unwrap();
              let mut manifest = String::from("schema=lomvi.kraken.blocks.v1\ncodec=Kraken\nlevel=Normal\nblock_size=65536\n");
              let names = ["IBM-Plex-Sans-Condensed-Medium.ufont", "Spectral-SemiBold.ufont"];
              for name in names {
                  let raw = fs::read(raw_dir.join(name)).unwrap();
                  manifest.push_str(&format!("file\t{}\t{}\t{}\n", name, raw.len(), (raw.len()+BLOCK-1)/BLOCK));
                  for (i, block) in raw.chunks(BLOCK).enumerate() {
                      let compressed = compress(OodleCompressor::Kraken, OodleLevel::Normal, block).unwrap();
                      let roundtrip = decompress(&compressed, block.len()).unwrap();
                      assert_eq!(roundtrip.as_slice(), block, "round-trip mismatch {} block {}", name, i);
                      let bn = format!("{}.block{:03}.kraken", name, i);
                      fs::write(out_dir.join(&bn), &compressed).unwrap();
                      manifest.push_str(&format!("block\t{}\t{}\t{}\t{}\t{}\n", name, i, block.len(), compressed.len(), bn));
                  }
              }
              fs::write(out_dir.join("manifest.tsv"), manifest).unwrap();
          }
          RS
          cargo run --release --manifest-path /tmp/kraken-tool/Cargo.toml -- /tmp/lomvi-font/raw /tmp/lomvi-font/kraken
          cp /tmp/lomvi-font/raw/*.ufont /tmp/lomvi-font/kraken/
          cp /tmp/lomvi-font/IBMPlexSansCondensed-Medium.ttf /tmp/lomvi-font/kraken/
          cp /tmp/lomvi-font/Spectral-SemiBold.ttf /tmp/lomvi-font/kraken/
          sha256sum /tmp/lomvi-font/kraken/* | sort > /tmp/lomvi-font/kraken/SHA256SUMS.txt
          cat /tmp/lomvi-font/kraken/manifest.tsv
          cat /tmp/lomvi-font/kraken/SHA256SUMS.txt

      - name: Upload precompressed font blocks only
        uses: actions/upload-artifact@v4
        with:
          name: lomvi-font-kraken-blocks
          path: /tmp/lomvi-font/kraken
          if-no-files-found: error
          retention-days: 1
