name: Temporary translation QC recon

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-translation-qc-recon.yml']

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect latest English patch v2.3.0 terminology
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/lomvi-en
          mkdir -p "$ROOT/pkg" "$ROOT/report"
          curl -fL --retry 3 'https://github.com/Lani27/lord-of-mysteries-english-patch/releases/download/v2.3.0/lom-english-patch-data.zip' -o "$ROOT/english.zip"
          echo '25001d06c2fab6bb0dc0195cf1d733d1670c7c1bac363438cc36a33573d6dbac  /tmp/lomvi-en/english.zip' | sha256sum -c -
          unzip -q "$ROOT/english.zip" -d "$ROOT/pkg"
          find "$ROOT/pkg" -type f -printf '%P\t%s\n' | sort > "$ROOT/report/file-list.txt"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/lomvi-en/pkg')
          terms=['神弃之地','灰雾之上','终末猎杀','主宰争锋','神座之争','命运时刻','众神之巅','四方联赛','猎城战','高原战','高原竞逐','世界冒险','封印物','梦魇冲击','戏法表演','我只是一条狗','子爵一阶','子爵二阶','子爵三阶','子爵四阶','子爵五阶','伯爵一阶','侯爵一阶','公爵一阶','亲王','骑士一阶','男爵一阶','段位','段位天梯','凯旋徽章','大帝的归来','战略服','以战养战','玩法入口','段位任务','野外500人混战','6对6组队赛事','四方240人战场','俱乐部1v1对决','身前半径4米的圆形区域','烈阳：身前半径5.6米的圆形区域','半径为8米的圆形','所有人脉技能等级同时提升','血肉阴影的伤害增加10%']
          files=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try: txt=p.read_text('utf-8')
              except Exception: continue
              files.append((p,txt))
          out=[]
          for term in terms:
              out.append(f'===== {term} =====')
              count=0
              for p,txt in files:
                  lines=txt.splitlines()
                  for i,line in enumerate(lines):
                      if term in line:
                          lo=max(0,i-2); hi=min(len(lines),i+3)
                          out.append(f'--- {p.relative_to(root)}:{i+1} ---')
                          out.extend(f'{j+1}: {lines[j]}' for j in range(lo,hi))
                          count+=1
                          if count>=20: break
                  if count>=20: break
              if count==0: out.append('(NO_HIT)')
          Path('/tmp/lomvi-en/report/english-target-context.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: english-v230-terminology-recon
          path: /tmp/lomvi-en/report
          retention-days: 1
          if-no-files-found: error
