name: Temporary translation QC recon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-translation-qc-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect current stable translation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qc/pkg" "$RUNNER_TEMP/qc/report"
          curl -fL --retry 3 'https://raw.githubusercontent.com/Kjndst/LoM-VI/main/channel/translation-2026.09.03.4.zip' -o "$RUNNER_TEMP/qc/current.zip"
          echo '33595aa3e8e703d5efa21a3718dedb4e2002970ef56623c6e7d7097eb01faa70  '$RUNNER_TEMP'/qc/current.zip' | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qc/current.zip" -d "$RUNNER_TEMP/qc/pkg"
          find "$RUNNER_TEMP/qc/pkg" -type f -printf '%P\t%s\n' | sort > "$RUNNER_TEMP/qc/report/file-list.txt"
          cp -a "$RUNNER_TEMP/qc/pkg" "$RUNNER_TEMP/qc/report/extracted"

          cat > "$RUNNER_TEMP/qc/targets.txt" <<'EOF'
正在校验资源文件
登录账号
服务器选择
熔断说明
可前往灵界召唤获取
新手
赛季剧情
躺赢
战略服
以战养战
竞逐
征伐
势力
大帝的归来
终末猎杀
神座之争
主宰争锋
命运时刻
众神之巅
四方联赛
俱乐部宣战
玩法入口
段位任务
每日8点刷新
每周一8点刷新
轻松躺赢
每周旅程
段位天梯
自动取段位天梯胜点最高
已有角色
推荐
诡秘世界
以神之名
征服者
永恒烈阳
黑皇帝
命运道标
空想家
塔罗会
愚者
福生玄黄
魔女
死神
白银城
霍纳奇斯
混沌海
廷根
黑荆棘
神弃之地
灰雾之上
源堡
贝克兰德
深渊
推荐方案
我的方案
我要变强
木桩训练
一键辅助
筛选技能
自身
以光为证
身前半径4米的圆形区域
烈阳：身前半径5.6米的圆形区域
半径为8米的圆形
所有
技能等级同时提升
序列晋升
血内阴影的伤害增加10%
家族
艺术学院
EOF

          : > "$RUNNER_TEMP/qc/report/target-hits.txt"
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            echo "===== $t =====" >> "$RUNNER_TEMP/qc/report/target-hits.txt"
            grep -RFn --binary-files=without-match -- "$t" "$RUNNER_TEMP/qc/pkg" >> "$RUNNER_TEMP/qc/report/target-hits.txt" || true
          done < "$RUNNER_TEMP/qc/targets.txt"

          grep -RInP --binary-files=without-match '[\x{3400}-\x{9FFF}]' "$RUNNER_TEMP/qc/pkg" > "$RUNNER_TEMP/qc/report/all-cjk-lines.txt" || true
          wc -l "$RUNNER_TEMP/qc/report/all-cjk-lines.txt" "$RUNNER_TEMP/qc/report/target-hits.txt" > "$RUNNER_TEMP/qc/report/counts.txt"

      - name: Inspect runtime/core matching behavior
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://raw.githubusercontent.com/Kjndst/LoM-VI/main/channel/core-0.2.0.4.zip' -o "$RUNNER_TEMP/qc/core.zip"
          echo '417720646328ec9aa7a031b6e024bdc82005618afddedcbbced5b49d27ae844e  '$RUNNER_TEMP'/qc/core.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qc/core"
          unzip -q "$RUNNER_TEMP/qc/core.zip" -d "$RUNNER_TEMP/qc/core"
          cp -a "$RUNNER_TEMP/qc/core" "$RUNNER_TEMP/qc/report/core-extracted"
          grep -RInE --binary-files=without-match 'IdOverrides|SafeLiterals|UiLiterals|NativeScan|literal|override|hook|Text|SetText|GetText|Register|module' "$RUNNER_TEMP/qc/core" > "$RUNNER_TEMP/qc/report/core-routing-hits.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: translation-qc-recon-20260905
          path: ${{ runner.temp }}/qc/report
          retention-days: 1
          if-no-files-found: error
