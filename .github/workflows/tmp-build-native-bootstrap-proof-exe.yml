name: Temporary native bootstrap proof EXE

on:
  push:
    branches:
      - build/native-bootstrap-recon-20260905
    paths:
      - '.github/workflows/tmp-build-native-bootstrap-proof-exe.yml'
      - 'tools/native-bootstrap-proof/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact upstream native bridge payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'native-proof'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir 'data.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/Lani27/lord-of-mysteries-english-patch/releases/download/v2.2.9/lom-english-patch-data.zip' -OutFile $zip
          if ((Get-Item $zip).Length -ne 16783086) { throw 'UPSTREAM_DATA_SIZE_MISMATCH' }
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne '28705ea108d2d46094ad7e7b991e3b4dd0b8db884087e33a09e24741a5004389') { throw 'UPSTREAM_DATA_SHA_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'data') -Force
          $bridge = Join-Path $dir 'data\payload\bridge\LaunchInstance.native-bridge.padded.oodle'
          if (-not (Test-Path $bridge)) { throw 'NATIVE_BRIDGE_MISSING' }
          if ((Get-Item $bridge).Length -ne 4660) { throw 'NATIVE_BRIDGE_SIZE_MISMATCH' }
          $bh = (Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bh -ne 'c031726986e09358bb18ff8a2b8ee5f0b4e65ce8ae8331eed2d7575c80b7efa9') { throw 'NATIVE_BRIDGE_SHA_MISMATCH' }
          Copy-Item $bridge 'tools\native-bootstrap-proof\bridge.bin' -Force

      - name: Compile proof utility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'native-proof-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $exe = Join-Path $out 'LoM-VI-Native-Bootstrap-Proof-build2018737.exe'
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'CSC_NOT_FOUND' }
          & $csc /nologo /optimize+ /platform:x64 /target:winexe `
            /reference:System.dll /reference:System.Core.dll /reference:System.Windows.Forms.dll `
            /win32manifest:tools\native-bootstrap-proof\app.manifest `
            /resource:tools\native-bootstrap-proof\bridge.bin,LoMVI.NativeBridge `
            /out:$exe tools\native-bootstrap-proof\Program.cs
          if ($LASTEXITCODE -ne 0) { throw "CSC_EXIT=$LASTEXITCODE" }
          if (-not (Test-Path $exe)) { throw 'EXE_NOT_CREATED' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          @"
          FILE=LoM-VI-Native-Bootstrap-Proof-build2018737.exe
          SIZE=$size
          SHA256=$sha
          GAME_BUILD=2018737
          TARGET=Content/Paks/pakchunk0-Windows.pak
          OFFSET=427225161
          REGION_SIZE=4660
          CLEAN_PAK_SHA256=abbadeeaec029807c6547d7faa9788f38da0099e8ea05ee20ff0167c0f5686d8
          PATCHED_PAK_SHA256=1712e55db2b9b4b6c8ff86e5a11b7ac56b9602951a08cbdb8c5face2687c6bd1
          CLEAN_REGION_SHA256=566e72d677fc974ab172eb71a34cdc6623f1e0dd19d978de812a76a1820b7fc7
          PATCHED_REGION_SHA256=c031726986e09358bb18ff8a2b8ee5f0b4e65ce8ae8331eed2d7575c80b7efa9
          "@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD.txt')
          Get-Content (Join-Path $out 'BUILD.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: lomvi-native-bootstrap-proof-exe-build2018737
          path: ${{ runner.temp }}\native-proof-out
          if-no-files-found: error
