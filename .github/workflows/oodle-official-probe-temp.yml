name: Probe official Oodle compressor source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oodle-official-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Download pinned DepotDownloader
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-windows-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\dd.zip"
          $f=Get-Item "$env:RUNNER_TEMP\dd.zip"
          if($f.Length -ne 33474005){ throw "Unexpected DepotDownloader bytes=$($f.Length)" }
          Expand-Archive "$env:RUNNER_TEMP\dd.zip" "$env:RUNNER_TEMP\dd" -Force
          & "$env:RUNNER_TEMP\dd\DepotDownloader.exe" --version

      - name: Fetch only SMITE Oodle DLL anonymously
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $list="$env:RUNNER_TEMP\filelist.txt"
          'Binaries/Win64/oo2core_7_win64.dll' | Set-Content -LiteralPath $list -Encoding ascii
          $out="$env:RUNNER_TEMP\smite"
          & "$env:RUNNER_TEMP\dd\DepotDownloader.exe" -app 386360 -depot 386361 -manifest 4767619368670136132 -os windows -osarch 64 -filelist $list -dir $out
          if($LASTEXITCODE -ne 0){ throw "DepotDownloader exit=$LASTEXITCODE" }
          $dll=Join-Path $out 'Binaries\Win64\oo2core_7_win64.dll'
          if(-not (Test-Path -LiteralPath $dll)){ throw 'Oodle DLL missing after depot download' }
          $f=Get-Item $dll
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          Write-Host "OODLE_PATH=$dll"
          Write-Host "OODLE_BYTES=$($f.Length)"
          Write-Host "OODLE_SHA256=$sha"
          if($f.Length -lt 900000 -or $f.Length -gt 1200000){ throw "Unexpected Oodle DLL size=$($f.Length)" }

      - name: Prove required exports without publishing DLL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll="$env:RUNNER_TEMP\smite\Binaries\Win64\oo2core_7_win64.dll"
          @'
          using System;
          using System.Runtime.InteropServices;
          public static class N {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibrary(string p);
            [DllImport("kernel32", SetLastError=true)] public static extern IntPtr GetProcAddress(IntPtr h,string n);
          }
          '@ | Set-Content "$env:RUNNER_TEMP\probe.cs" -Encoding ascii
          Add-Type -Path "$env:RUNNER_TEMP\probe.cs"
          $h=[N]::LoadLibrary($dll); if($h -eq [IntPtr]::Zero){throw "LoadLibrary failed $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"}
          foreach($n in @('OodleLZ_Compress','OodleLZ_Decompress','OodleLZ_GetCompressedBufferSizeNeeded')){
            $p=[N]::GetProcAddress($h,$n); Write-Host "$n=$p"; if($p -eq [IntPtr]::Zero){throw "Missing export $n"}
          }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\smite"
