name: Build LoM-VI translation channel 2026.09.03.3

on:
  push:
    branches: [main]
    paths:
      - 'channel/build/translation-line-delta.part-*'
      - '.github/workflows/build-channel-2026-09-03.yml'

permissions:
  contents: write

jobs:
  build-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Translation 2026.09.03.3
        shell: bash
        run: |
          set -euo pipefail
          OLD=/tmp/translation-2026.09.02.1.zip
          WORK=/tmp/lomvi-translation-work
          DELTA_XZ=/tmp/translation-line-delta.json.xz
          DELTA=/tmp/translation-line-delta.json
          OUT="$GITHUB_WORKSPACE/channel/translation-2026.09.03.3.zip"
          curl --fail --location --retry 3 \
            'https://github.com/Kjndst/LoM-VI/releases/download/v0.2.0-data.1/translation-2026.09.02.1.zip' \
            --output "$OLD"
          test "$(stat -c '%s' "$OLD")" = '1665844'
          echo '84a39591498d9e2335e9157930426802d0141b1004307bfd4db04c4e5f4543cc  /tmp/translation-2026.09.02.1.zip' | sha256sum -c -
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$OLD" -d "$WORK"
          cat "$GITHUB_WORKSPACE"/channel/build/translation-line-delta.part-* > "$DELTA_XZ"
          xz -t "$DELTA_XZ"
          xz -dc "$DELTA_XZ" > "$DELTA"
          python3 - "$WORK" "$DELTA" <<'PY'
          import json
          import os
          import sys

          root, delta_path = sys.argv[1:]
          with open(delta_path, encoding='utf-8') as handle:
              delta = json.load(handle)

          for rel, spec in delta['files'].items():
              path = os.path.join(root, *rel.split('/'))
              if os.path.exists(path):
                  with open(path, encoding='utf-8', newline='') as handle:
                      lines = handle.readlines()
              else:
                  lines = []
              assert len(lines) == spec['old_lines'], (rel, len(lines), spec['old_lines'])
              for i1, i2, newlines in reversed(spec['ops']):
                  lines[i1:i2] = newlines
              assert len(lines) == spec['new_lines'], (rel, len(lines), spec['new_lines'])
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8', newline='') as handle:
                  handle.writelines(lines)
          PY
          python3 - "$WORK" "$OUT" <<'PY'
          import os
          import sys
          import zipfile

          root, out = sys.argv[1:]
          files = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames.sort()
              filenames.sort()
              for filename in filenames:
                  path = os.path.join(dirpath, filename)
                  rel = os.path.relpath(path, root).replace(os.sep, '/')
                  files.append((rel, path))

          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for rel, path in sorted(files):
                  info = zipfile.ZipInfo(rel, (2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = (0o100644 << 16)
                  with open(path, 'rb') as handle:
                      archive.writestr(info, handle.read(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          test "$(stat -c '%s' "$OUT")" = '1669071'
          echo '5a58e08ec758e0c7824c8eccda71ab3cb7e4e5165da5de13a60002d65f60e87d  channel/translation-2026.09.03.3.zip' | sha256sum -c -

      - name: Publish reconstructed payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/translation-2026.09.03.3.zip
          if git diff --cached --quiet; then
            echo 'Translation payload already current.'
            exit 0
          fi
          git commit -m 'channel: publish translation 2026.09.03.3'
          git push origin HEAD:main
