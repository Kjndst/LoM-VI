name: R15 final transfer airlock

on:
  push:
    branches: [test/r15-translation]
    paths:
      - '.github/workflows/r15-final-transfer.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/r15-translation

      - name: Resolve signed download and verify final artifact
        shell: bash
        env:
          API_BASE: https://api.firestorage.ai/dev/file
          SHARE_ID: _cF9atQZUONX
          EXPECTED_NAME: translation-2026.09.07.1.zip
          EXPECTED_SHA: bf55ec014a4df2e81940a7bf239930be1193dbd1baa751f4f77d9ac6c55cda42
          EXPECTED_SIZE: '4939684'
        run: |
          set -euo pipefail
          mkdir -p .transfer
          curl -fsSL --retry 3 --retry-delay 1 \
            "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" \
            -o .transfer/files.json

          python3 - <<'PY' > .transfer/file_id.txt
          import json, os, sys
          data=json.load(open('.transfer/files.json',encoding='utf-8'))
          name=os.environ['EXPECTED_NAME']; size=int(os.environ['EXPECTED_SIZE'])
          matches=[f for f in data.get('files',[]) if f.get('fileName')==name and int(f.get('sizeBytes',-1))==size]
          if len(matches)!=1:
              print('file listing:',json.dumps(data,ensure_ascii=False),file=sys.stderr)
              raise SystemExit(f'expected exactly one matching file, got {len(matches)}')
          print(matches[0]['fileId'])
          PY
          file_id=$(cat .transfer/file_id.txt)

          curl -fsSL --retry 3 --retry-delay 1 \
            -X POST "$API_BASE/shares/$SHARE_ID/files/$file_id/download" \
            -H 'Content-Type: application/json' \
            -o .transfer/download.json

          python3 - <<'PY' > .transfer/download_url.txt
          import json
          data=json.load(open('.transfer/download.json',encoding='utf-8'))
          url=data.get('downloadUrl')
          if not isinstance(url,str) or not url.startswith('https://'):
              raise SystemExit('missing HTTPS downloadUrl')
          print(url)
          PY
          download_url=$(cat .transfer/download_url.txt)
          curl -fsSL --retry 3 --retry-delay 1 "$download_url" -o .transfer/final.zip

          actual_size=$(stat -c '%s' .transfer/final.zip)
          actual_sha=$(sha256sum .transfer/final.zip | awk '{print $1}')
          echo "size=$actual_size"
          echo "sha256=$actual_sha"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA"
          unzip -t .transfer/final.zip

          python3 - <<'PY'
          import zipfile
          p='.transfer/final.zip'
          expected={
            'game/Saved/Mods/lua/mods/lom_vi/IdOverrides.lua',
            'game/Saved/Mods/lua/mods/lom_vi/SafeLiterals.lua',
            'game/Saved/Mods/lua/mods/lom_vi/UiLiterals.lua',
          }
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
          if names != expected:
              raise SystemExit(f'unexpected ZIP tree: {sorted(names)}')
          print('ZIP tree verified')
          PY

      - name: Stage verified artifact on test channel
        shell: bash
        run: |
          set -euo pipefail
          cp .transfer/final.zip channel/translation-2026.09.07.1.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/translation-2026.09.07.1.zip
          git commit -m 'build: stage translation 2026.09.07.1'
          git push origin HEAD:test/r15-translation
