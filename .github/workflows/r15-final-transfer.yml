name: R15 final transfer airlock

on:
  push:
    branches: [test/r15-translation]
    paths:
      - '.github/workflows/r15-final-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/r15-translation

      - name: Probe transfer and verify final artifact
        id: transfer
        continue-on-error: true
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/_cF9atQZUONX
          EXPECTED_SHA: bf55ec014a4df2e81940a7bf239930be1193dbd1baa751f4f77d9ac6c55cda42
          EXPECTED_SIZE: '4939684'
        run: |
          set -u
          mkdir -p .transfer
          : > .transfer/diagnostic.txt
          echo "expected_size=$EXPECTED_SIZE" >> .transfer/diagnostic.txt
          echo "expected_sha=$EXPECTED_SHA" >> .transfer/diagnostic.txt
          curl -sSL --retry 2 --retry-delay 1 -D .transfer/headers.txt "$SHARE_URL" -o .transfer/share.bin || true
          echo '--- headers ---' >> .transfer/diagnostic.txt
          sed -n '1,120p' .transfer/headers.txt >> .transfer/diagnostic.txt 2>/dev/null || true
          echo '--- share payload ---' >> .transfer/diagnostic.txt
          if [ -f .transfer/share.bin ]; then
            echo "share_size=$(stat -c '%s' .transfer/share.bin)" >> .transfer/diagnostic.txt
            echo "share_sha=$(sha256sum .transfer/share.bin | awk '{print $1}')" >> .transfer/diagnostic.txt
            file .transfer/share.bin >> .transfer/diagnostic.txt || true
          fi

          verify() {
            local f="$1"
            [ -f "$f" ] || return 1
            local size sha
            size=$(stat -c '%s' "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            echo "candidate=$f size=$size sha=$sha" >> .transfer/diagnostic.txt
            [ "$size" = "$EXPECTED_SIZE" ] && [ "$sha" = "$EXPECTED_SHA" ] && unzip -t "$f" >/dev/null
          }

          if verify .transfer/share.bin; then
            cp .transfer/share.bin .transfer/final.zip
            echo 'verified=share_url' >> .transfer/diagnostic.txt
            exit 0
          fi

          python3 - <<'PY' > .transfer/urls.txt
          import re, html
          raw=open('.transfer/share.bin','rb').read().decode('utf-8','ignore') if __import__('os').path.exists('.transfer/share.bin') else ''
          raw=html.unescape(raw)
          urls=[]
          for pat in [r'https?://[^"\'<>\\\s]+', r'(?:href|src)=["\']([^"\']+)["\']']:
              urls += re.findall(pat, raw)
          seen=[]
          for u in urls:
              if isinstance(u, tuple): u=u[0]
              if u not in seen:
                  seen.append(u)
          print('\n'.join(seen))
          PY
          echo '--- discovered urls ---' >> .transfer/diagnostic.txt
          sed -n '1,200p' .transfer/urls.txt >> .transfer/diagnostic.txt

          n=0
          while IFS= read -r u; do
            case "$u" in /*) u="https://firestorage.ai$u" ;; esac
            case "$u" in http://*|https://*) ;; *) continue ;; esac
            n=$((n+1)); out=".transfer/candidate-$n.bin"
            curl -sSL --retry 1 "$u" -o "$out" || continue
            if verify "$out"; then
              cp "$out" .transfer/final.zip
              echo "verified=url-$n" >> .transfer/diagnostic.txt
              exit 0
            fi
          done < .transfer/urls.txt
          echo 'verified=no' >> .transfer/diagnostic.txt
          exit 42

      - name: Commit verified artifact or diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .transfer/final.zip ]; then
            cp .transfer/final.zip channel/translation-2026.09.07.1.zip
            sha256sum channel/translation-2026.09.07.1.zip
            unzip -t channel/translation-2026.09.07.1.zip
            git add channel/translation-2026.09.07.1.zip
            git commit -m 'build: stage translation 2026.09.07.1'
          else
            cp .transfer/diagnostic.txt channel/r15-transfer-diagnostic.txt
            git add channel/r15-transfer-diagnostic.txt
            git commit -m 'test: capture R15 transfer diagnostic'
          fi
          git push origin HEAD:test/r15-translation

      - name: Enforce verified transfer
        if: steps.transfer.outcome != 'success'
        run: exit 42
