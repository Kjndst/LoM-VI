name: tmp-fetch-oodle-linux

on:
  push:
    branches:
      - build/font-body-oodle
    paths:
      - '.github/workflows/tmp-fetch-oodle-linux.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Oodle Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/Fortniteleakjp/oo2core_9_Linux/main/liboo2corelinux64.so.9'
          curl -fL --retry 3 --retry-delay 2 "$url" -o liboo2corelinux64.so.9
          test "$(stat -c%s liboo2corelinux64.so.9)" = '688096'
          sha256sum liboo2corelinux64.so.9
      - name: Fetch pinned IBM Plex Sans Condensed donor
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/IBM/plex/releases/download/%40ibm/plex-sans-condensed%401.1.0/ibm-plex-sans-condensed.zip'
          curl -fL --retry 3 --retry-delay 2 "$url" -o ibm-plex-sans-condensed.zip
          test "$(stat -c%s ibm-plex-sans-condensed.zip)" = '5823577'
          sha256sum ibm-plex-sans-condensed.zip
          mkdir -p plex
          unzip -q ibm-plex-sans-condensed.zip -d plex
          donor="$(find plex -type f -iname 'IBMPlexSansCondensed-Medium.ttf' -print -quit)"
          test -n "$donor"
          cp "$donor" IBMPlexSansCondensed-Medium.ttf
          sha256sum IBMPlexSansCondensed-Medium.ttf
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: oodle-linux-9
          path: liboo2corelinux64.so.9
          if-no-files-found: error
          retention-days: 1
      - name: Upload IBM Plex donor artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibm-plex-sans-condensed-medium
          path: IBMPlexSansCondensed-Medium.ttf
          if-no-files-found: error
          retention-days: 1
