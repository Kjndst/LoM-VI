name: tmp-publish-font-body

on:
  push:
    branches:
      - build/font-body-publish
    paths:
      - channel/build/font-body-publish-source.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact sealed Body package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="$GITHUB_WORKSPACE/channel/build/font-body-publish-source.txt"
          test -f "$SOURCE_FILE"
          URL="$(tr -d '\r\n' < "$SOURCE_FILE")"
          case "$URL" in
            https://*) ;;
            *) echo 'Source URL must be HTTPS' >&2; exit 2 ;;
          esac

          OUT=/tmp/font-2026.09.04.1-build2018737.zip
          if [[ "$URL" == https://drive.google.com/* ]]; then
            python3 -m pip install --disable-pip-version-check --quiet 'gdown==5.2.0'
            gdown --fuzzy "$URL" --output "$OUT"
          else
            curl --fail --location --retry 3 --retry-all-errors "$URL" --output "$OUT"
          fi

          test "$(stat -c '%s' "$OUT")" = '47643492'
          echo '4e363da26fc09eb59e41e92abb5ee3f2e05aa9fdc96922fb993025a1d381a4a2  /tmp/font-2026.09.04.1-build2018737.zip' | sha256sum -c -
          unzip -t "$OUT"

      - name: Reconcile main and publish binary only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-main origin/main

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('channel/manifest-v3-dev.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          f = m['font']
          assert f['version'] == '2026.09.04.1-dev'
          assert f['available'] is False
          assert f['game_build'] == '2018737'
          assert f['package_name'] == 'font-2026.09.04.1-build2018737.zip'
          assert f['sha256'] == '4e363da26fc09eb59e41e92abb5ee3f2e05aa9fdc96922fb993025a1d381a4a2'
          PY

          cp /tmp/font-2026.09.04.1-build2018737.zip channel/font-2026.09.04.1-build2018737.zip
          echo '4e363da26fc09eb59e41e92abb5ee3f2e05aa9fdc96922fb993025a1d381a4a2  channel/font-2026.09.04.1-build2018737.zip' | sha256sum -c -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/font-2026.09.04.1-build2018737.zip
          if git diff --cached --quiet; then
            echo 'Exact Body package already published.'
            exit 0
          fi
          git commit -m 'channel: publish Body font candidate 2026.09.04.1'
          git push origin HEAD:main
