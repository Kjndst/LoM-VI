name: R15 transfer probe

on:
  push:
    branches: [test/r15-translation]
    paths:
      - '.github/workflows/r15-transfer-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/r15-translation
      - name: Capture Firestorage download client chunk
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --retry 2 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o channel/r15-firestorage-4899.js
          test "$(stat -c '%s' channel/r15-firestorage-4899.js)" -gt 30000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/r15-firestorage-4899.js
          git commit -m 'test: capture Firestorage client chunk for transfer audit'
          git push origin HEAD:test/r15-translation
