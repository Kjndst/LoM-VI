name: Temporary build and publish Font Full v2

on:
  push:
    branches:
      - build/font-full-v2-20260905
    paths:
      - '.github/workflows/tmp-build-publish-font-full-v2.yml'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/data
          sudo chown "$USER" /mnt/data
          python -m pip install --quiet fonttools
          curl -fL --retry 3 'https://raw.githubusercontent.com/Kjndst/LoM-VI/main/channel/font-2026.09.04.1-build2018737.zip' -o /mnt/data/body.zip
          echo '4e363da26fc09eb59e41e92abb5ee3f2e05aa9fdc96922fb993025a1d381a4a2  /mnt/data/body.zip' | sha256sum -c -
          mkdir -p /mnt/data/body_pkg && unzip -q /mnt/data/body.zip -d /mnt/data/body_pkg
          mkdir -p /mnt/data/oodlelib
          curl -fL --retry 3 'https://raw.githubusercontent.com/Fortniteleakjp/oo2core_9_Linux/main/liboo2corelinux64.so.9' -o /mnt/data/oodlelib/liboo2corelinux64.so.9
          echo '9f00b5c24e3aeef72c1a79ae972a68b21a60a82e20a37e85c626400897d25ac5  /mnt/data/oodlelib/liboo2corelinux64.so.9' | sha256sum -c -
          curl -fL --retry 3 'https://github.com/IBM/plex/releases/download/%40ibm/plex-sans-condensed%401.1.0/ibm-plex-sans-condensed.zip' -o /mnt/data/ibm.zip
          mkdir -p /mnt/data/ibm-tmp /mnt/data/ibm && unzip -q /mnt/data/ibm.zip -d /mnt/data/ibm-tmp
          cp "$(find /mnt/data/ibm-tmp -type f -iname 'IBMPlexSansCondensed-Medium.ttf' -print -quit)" /mnt/data/ibm/IBMPlexSansCondensed-Medium.ttf
          echo 'db1c6feefd95f8340b5afc41fe777746368fe863cdeb7d1d2830cd1c08f1d700  /mnt/data/ibm/IBMPlexSansCondensed-Medium.ttf' | sha256sum -c -
          mkdir -p /mnt/data/spectral-donor
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/spectral/Spectral-SemiBold.ttf' -o /mnt/data/spectral-donor/Spectral-SemiBold.ttf
          echo '5f86915a744832ecf6e4a17ab04bea091b9fa992ef5164ff65ae34c1da2fe94b  /mnt/data/spectral-donor/Spectral-SemiBold.ttf' | sha256sum -c -
      - name: Extract seven UFonts from sealed Body v1 PAK
        shell: bash
        run: |
          python - <<'PYEX'
          from pathlib import Path
          import ctypes,struct
          lib=ctypes.CDLL('/mnt/data/oodlelib/liboo2corelinux64.so.9')
          d=lib.OodleLZ_Decompress; d.restype=ctypes.c_longlong
          d.argtypes=[ctypes.c_void_p,ctypes.c_longlong,ctypes.c_void_p,ctypes.c_longlong,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_void_p,ctypes.c_longlong,ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,ctypes.c_longlong,ctypes.c_int]
          p=Path('/mnt/data/body_pkg/game/Content/Paks/pakchunk99998-Windows_LVI_STOCK_CLONE_P.pak').read_bytes()
          offs=[0,5632000,11268096,14585856,17928192,21241856,22546432]
          for folder in ['/mnt/data/ufonts_body','/mnt/data/ufonts_stock']: Path(folder).mkdir(exist_ok=True)
          for idx,o in enumerate(offs):
              raw_size=struct.unpack_from('<q',p,o+16)[0]; bc=struct.unpack_from('<I',p,o+48)[0]
              pairs=[struct.unpack_from('<qq',p,o+52+j*16) for j in range(bc)]
              raw=bytearray()
              for s,e in pairs:
                  comp=p[o+s:o+e]; want=min(65536,raw_size-len(raw)); src=ctypes.create_string_buffer(comp,len(comp)); dst=ctypes.create_string_buffer(want)
                  got=d(src,len(comp),dst,want,1,0,0,None,0,None,None,None,0,3)
                  if got!=want: raise SystemExit(f'decompress fail entry={idx} got={got} want={want}')
                  raw.extend(dst.raw[:want])
              Path(f'/mnt/data/ufonts_body/entry{idx}.ufont').write_bytes(raw)
              Path(f'/mnt/data/ufonts_stock/entry{idx}.ufont').write_bytes(raw)
          PYEX
      - name: Restore build scripts and build exact candidate
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /mnt/data/font_full_v2_builder.py
          echo '' | base64 -d | gzip -d > /mnt/data/font_full_v2_pak_builder.py
          python /mnt/data/font_full_v2_builder.py >/tmp/font-build.txt
          python /mnt/data/font_full_v2_pak_builder.py >/tmp/pak-build.txt
          grep -q 'PASS_FONT_FULL_V2_PAK_MAINTAINER_VALIDATION' /tmp/pak-build.txt
      - name: Seal deterministic package and require local identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /mnt/data/font_full_v2_pkg/clean/Content /mnt/data/font_full_v2_pkg/game/Content
          cp /mnt/data/body_pkg/clean/Content/inner.cache /mnt/data/font_full_v2_pkg/clean/Content/inner.cache
          cp /mnt/data/body_pkg/game/Content/inner.cache /mnt/data/font_full_v2_pkg/game/Content/inner.cache
          python - <<'PYZIP'
          from pathlib import Path
          import zipfile
          root=Path('/mnt/data/font_full_v2_pkg'); out=Path('/mnt/data/font-2026.09.05.1-build2018737.zip')
          paths=['clean/Content/inner.cache','game/Content/Paks/pakchunk99998-Windows_LVI_STOCK_CLONE_P.pak','game/Content/inner.cache','validation/FONT_FULL_V2_PAK_VALIDATION.json','validation/FONT_FULL_V2_REPORT.json']
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in paths:
                  info=zipfile.ZipInfo(rel,date_time=(2026,9,5,2,30,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=(0o644<<16)
                  z.writestr(info,(root/rel).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              for rel in paths: assert z.read(rel)==(root/rel).read_bytes()
          PYZIP
          test "$(stat -c '%s' /mnt/data/font-2026.09.05.1-build2018737.zip)" = '47509296'
          echo '8fdf559401b1c3a42ae1f816f029f999690bb991445e660a4d405f0b960bedac  /mnt/data/font-2026.09.05.1-build2018737.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: font-2026.09.05.1-build2018737
          path: /mnt/data/font-2026.09.05.1-build2018737.zip
          if-no-files-found: error
      - name: Publish exact sealed binary to main channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B publish-main origin/main
          cp /mnt/data/font-2026.09.05.1-build2018737.zip channel/font-2026.09.05.1-build2018737.zip
          git add channel/font-2026.09.05.1-build2018737.zip
          git diff --cached --quiet && exit 0
          git commit -m 'channel: publish full Vietnamese + Spectral font candidate 2026.09.05.1'
          git push origin HEAD:main
