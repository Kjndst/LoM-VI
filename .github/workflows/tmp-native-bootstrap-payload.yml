name: Temporary native bootstrap proof payload

on:
  push:
    branches:
      - build/native-bootstrap-recon-20260905
    paths:
      - '.github/workflows/tmp-native-bootstrap-payload.yml'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact upstream 2.2.9 data
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/Lani27/lord-of-mysteries-english-patch/releases/download/v2.2.9/lom-english-patch-data.zip' \
            -o /tmp/data.zip
          test "$(stat -c '%s' /tmp/data.zip)" = '16783086'
          echo '28705ea108d2d46094ad7e7b991e3b4dd0b8db884087e33a09e24741a5004389  /tmp/data.zip' | sha256sum -c -

      - name: Extract and seal exact 4660-byte native bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          unzip -p /tmp/data.zip 'payload/bridge/LaunchInstance.native-bridge.padded.oodle' > /tmp/out/LaunchInstance.native-bridge.padded.oodle
          test "$(stat -c '%s' /tmp/out/LaunchInstance.native-bridge.padded.oodle)" = '4660'
          echo 'c031726986e09358bb18ff8a2b8ee5f0b4e65ce8ae8331eed2d7575c80b7efa9  /tmp/out/LaunchInstance.native-bridge.padded.oodle' | sha256sum -c -
          cat > /tmp/out/NATIVE_BOOTSTRAP_CONTRACT.txt <<'EOF'
          GAME_BUILD=2018737
          TARGET=Content/Paks/pakchunk0-Windows.pak
          OFFSET=427225161
          SIZE=4660
          SUPPORTED_CLEAN_PAK_SHA256=abbadeeaec029807c6547d7faa9788f38da0099e8ea05ee20ff0167c0f5686d8
          CLEAN_REGION_SHA256=566e72d677fc974ab172eb71a34cdc6623f1e0dd19d978de812a76a1820b7fc7
          CPDD_REGION_SHA256=c031726986e09358bb18ff8a2b8ee5f0b4e65ce8ae8331eed2d7575c80b7efa9
          CPDD_PATCHED_PAK_SHA256=1712e55db2b9b4b6c8ff86e5a11b7ac56b9602951a08cbdb8c5face2687c6bd1
          CPDD_PATCHED_PAK_SIZE=446910011
          UPSTREAM_DATA_VERSION=2.2.9
          UPSTREAM_DATA_SHA256=28705ea108d2d46094ad7e7b991e3b4dd0b8db884087e33a09e24741a5004389
          EOF
          sed -i 's/^          //' /tmp/out/NATIVE_BOOTSTRAP_CONTRACT.txt
          sha256sum /tmp/out/*

      - uses: actions/upload-artifact@v4
        with:
          name: lomvi-native-bootstrap-proof-build2018737
          path: /tmp/out
          if-no-files-found: error
